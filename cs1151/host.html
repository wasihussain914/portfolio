<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>beat the rate — floor manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --ink:#131a22; --navy:#232f3e; --navy2:#2c3a4d; --card:#1b2532; --chip:#37475a;
    --orange:#ff9900; --orange2:#ffb84d; --light:#eaeded; --muted:#8e9aa8;
    --red:#ff7a63; --green:#3ec46d;
    --shadow: 0 12px 34px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Inter',-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background: radial-gradient(1400px 800px at 50% -15%, #2c3a4d 0%, var(--navy) 50%, var(--ink) 100%);
    color:var(--light); min-height:100vh; padding:26px 38px 34px;
  }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .brand { display:flex; flex-direction:column; }
  .wordmark { font-weight:900; font-size:2.1rem; letter-spacing:-.02em; line-height:1; }
  .wordmark em { font-style:normal; color:var(--orange); }
  .brand svg { width:130px; margin-top:4px; }
  .controls { display:flex; align-items:center; gap:14px; }
  #clock { font-size:2.2rem; font-weight:900; font-variant-numeric:tabular-nums; min-width:92px; text-align:right; }
  #clock.low { color:var(--red); animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  .btn {
    background:linear-gradient(180deg,var(--orange2),var(--orange)); color:#1a1205; font-weight:800;
    border:0; border-radius:999px; padding:13px 30px; font-size:1rem; font-family:inherit; cursor:pointer;
    box-shadow:0 6px 18px rgba(255,153,0,.3), inset 0 1px 0 rgba(255,255,255,.35); transition:transform .12s;
  }
  .btn:active { transform:scale(.96); }
  .btn.ghost { background:transparent; color:var(--muted); border:1px solid #46586e; box-shadow:none; }

  #clockbar { height:9px; background:var(--card); border-radius:5px; margin:4px 0 22px; overflow:hidden; }
  #clockfill { height:100%; width:100%; background:linear-gradient(90deg,var(--orange),var(--orange2)); transition:width 1s linear; border-radius:5px; }

  main { display:grid; grid-template-columns:320px 1fr 330px; gap:20px; }
  .card { background:rgba(27,37,50,.88); border:1px solid rgba(255,255,255,.055); border-radius:16px; padding:22px; box-shadow:var(--shadow); }
  .card h2 { font-size:.72rem; letter-spacing:.18em; color:var(--orange); margin-bottom:14px; font-weight:800; }

  #qr { background:#fff; padding:13px; width:fit-content; border-radius:10px; margin:0 auto; box-shadow:0 4px 14px rgba(0,0,0,.4); }
  .joinurl { text-align:center; margin-top:12px; color:var(--light); font-size:1.02rem; font-weight:700; }
  .joinurl span { color:var(--orange); }
  .bignum { font-size:4.6rem; font-weight:900; color:var(--orange); text-align:center; line-height:1; margin-top:24px; font-variant-numeric:tabular-nums; transition:transform .25s; }
  .bignum.bump { transform:scale(1.12); }
  .bigsub { display:block; text-align:center; font-size:.7rem; color:var(--muted); font-weight:700; letter-spacing:.16em; margin-top:8px; }
  .duo { display:flex; justify-content:space-around; margin-top:22px; text-align:center; }
  .duo b { font-size:2.1rem; display:block; font-variant-numeric:tabular-nums; }
  .duo span { font-size:.68rem; color:var(--muted); letter-spacing:.14em; font-weight:700; }
  .duo .dead b { color:var(--red); } .duo .alive b { color:var(--green); }

  #board { display:grid; grid-template-columns:repeat(auto-fill,minmax(152px,1fr)); gap:10px; max-height:70vh; overflow:auto; padding-right:4px; }
  #board::-webkit-scrollbar { width:6px; } #board::-webkit-scrollbar-thumb { background:var(--chip); border-radius:3px; }
  .pl { background:var(--chip); border-radius:10px; padding:11px 13px; border-left:4px solid var(--green); transition:opacity .4s, transform .3s; }
  .pl.dead { border-left-color:var(--red); opacity:.5; background:#2e211d; }
  .pl .nm { font-weight:800; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl .st { font-size:.78rem; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums; }
  .pl .st .ok { color:var(--green); font-weight:700; }
  #empty { color:var(--muted); font-size:.95rem; grid-column:1/-1; text-align:center; padding:30px 0; }

  #feed { max-height:64vh; overflow:auto; font-size:.9rem; }
  #feed .t { padding:9px 2px; border-bottom:1px solid #27354a; color:var(--red); animation:slidein .35s cubic-bezier(.2,.9,.3,1); line-height:1.45; }
  #feed .t small { color:var(--muted); display:block; font-size:.74rem; }
  @keyframes slidein { from { opacity:0; transform:translateX(26px); } to { opacity:1; transform:none; } }
  #feedempty { color:var(--muted); padding:8px 0; font-size:.9rem; }

  #overbanner {
    display:none; margin:0 0 18px; padding:16px 24px; border-radius:14px; text-align:center;
    background:rgba(255,153,0,.1); border:1px solid rgba(255,153,0,.45); font-size:1.25rem; font-weight:800;
  }
  #overbanner b { color:var(--orange); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="wordmark">beat the <em>rate</em></div>
    <svg viewBox="0 0 120 30"><path d="M6 8 C 36 30, 84 30, 108 12" fill="none" stroke="#ff9900" stroke-width="6" stroke-linecap="round"/><path d="M100 4 L 112 10 L 101 19" fill="none" stroke="#ff9900" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="controls">
    <span id="clock">90s</span>
    <button class="btn" id="startbtn">▶ Start shift</button>
    <button class="btn ghost" id="resetbtn">Reset</button>
  </div>
</header>
<div id="clockbar"><div id="clockfill"></div></div>
<div id="overbanner">SHIFT OVER — <b id="survcount">0</b> of <b id="totcount">0</b> associates survived the algorithm</div>

<main>
  <div class="card">
    <h2>CLOCK IN</h2>
    <div id="qr"></div>
    <div class="joinurl">wasihussain.com/<span>cs1151</span></div>
    <div class="bignum" id="req">20</div>
    <span class="bigsub">REQUIRED PICKS / MIN</span>
    <div class="duo">
      <div class="alive"><b id="alive">0</b><span>EMPLOYED</span></div>
      <div class="dead"><b id="dead">0</b><span>TERMINATED</span></div>
    </div>
  </div>

  <div class="card">
    <h2>THE FLOOR</h2>
    <div id="board"><div id="empty">Waiting for associates to clock in…</div></div>
  </div>

  <div class="card">
    <h2>TERMINATION FEED</h2>
    <div id="feed"><div id="feedempty">No terminations yet. The system is patient.</div></div>
  </div>
</main>

<script>
const API = "https://admin.wasihussain.com/cs1151";
const KEY = new URLSearchParams(location.search).get("key") || "";
new QRCode(document.getElementById("qr"), {text:"https://wasihussain.com/cs1151/", width:168, height:168, correctLevel:QRCode.CorrectLevel.M});
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lastFired = 0, lastReq = 20;

$("startbtn").onclick = () =>
  fetch(API+"/start", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:KEY})})
  .then(r=>r.json()).then(d=>{ if(!d.ok) alert("Bad host key — open this page with ?key=YOURKEY"); else { lastFired=0; $("feed").innerHTML='<div id="feedempty">No terminations yet. The system is patient.</div>'; $("overbanner").style.display="none"; } });

$("resetbtn").onclick = () => {
  if (!confirm("Reset the whole game? Everyone will need to rejoin.")) return;
  fetch(API+"/reset", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key:KEY})})
  .then(()=>{ lastFired=0; $("feed").innerHTML='<div id="feedempty">No terminations yet. The system is patient.</div>'; $("overbanner").style.display="none"; });
};

async function tick() {
  try {
    const d = await (await fetch(API+"/state")).json();
    const req = Math.round(d.required);
    if (req !== lastReq) { $("req").classList.add("bump"); setTimeout(()=>$("req").classList.remove("bump"), 260); lastReq = req; }
    $("req").textContent = req;
    $("alive").textContent = d.alive;
    $("dead").textContent = d.total - d.alive;
    $("clock").textContent = d.time_left + "s";
    $("clock").classList.toggle("low", d.running && d.time_left <= 15);
    $("clockfill").style.width = (d.time_left/90*100) + "%";

    $("board").innerHTML = d.players.length ? d.players.map(p =>
      `<div class="pl ${p.status==='terminated'?'dead':''}">
         <div class="nm">${esc(p.name)}</div>
         <div class="st">${p.status==='terminated'
            ? '❌ terminated @ '+Math.round(p.fired_at)+'s'
            : '📦 '+p.picks+' · <span class="ok">'+p.rate+'/min</span>'}</div>
       </div>`).join("") : '<div id="empty">Waiting for associates to clock in…</div>';

    if (d.fired_order.length > lastFired) {
      if ($("feedempty")) $("feedempty").remove();
      for (let i=lastFired; i<d.fired_order.length; i++)
        $("feed").insertAdjacentHTML("afterbegin",
          `<div class="t">❌ <b>${esc(d.fired_order[i])}</b> — terminated by system<small>No supervisor input · not eligible for appeal</small></div>`);
      lastFired = d.fired_order.length;
    }
    if (d.over && d.total) {
      $("overbanner").style.display = "block";
      $("survcount").textContent = d.alive;
      $("totcount").textContent = d.total;
    }
  } catch(e) {}
  setTimeout(tick, 1000);
}
tick();
</script>
</body>
</html>
